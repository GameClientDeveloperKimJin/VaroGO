# VAROGO 자동 빌드 — 셀프 호스티드 러너(라벨 varogo-build)가 Windows exe를 만들어 팀 Google Drive에 vN으로 올린다.
# 실행 방법 (요청한 브랜치의 GitHub에 올라간 커밋을 빌드):
#   - Claude Code: /build            - Unity: Tools > Build        (둘 다 Tools/CI/trigger_build.ps1)
#   - Actions 탭 → Build → Run workflow (이 파일이 main에 있어야 버튼이 보임)
name: Build

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: '씬 이름 또는 경로, 쉼표로 여러 개 (첫 번째가 시작 씬). 비우면 11_SpiralCourse'
        required: false
        default: ''
      release:
        description: '릴리스 빌드 (디버그 키 꺼짐)'
        type: boolean
        default: false

# 빌드는 한 번에 하나만. 밀린 건 순서대로
concurrency:
  group: varogo-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Windows, varogo-build]
    timeout-minutes: 120
    steps:
      # clean: false — Library 폴더(가져온 에셋 캐시)를 지우지 않아야 두 번째 빌드부터 빠르다
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Unity 빌드 → Drive 업로드
        shell: powershell
        env:
          VAROGO_SCENES: ${{ inputs.scenes }}
          VAROGO_RELEASE: ${{ inputs.release }}
        run: powershell -ExecutionPolicy Bypass -File Tools/CI/ci_build.ps1
